name: NMPC - mo hinh rut gon va chay thu

# Buoc E (mo hinh rut gon, so voi DFN) va buoc G (NMPC acados, chay thu vong kin).
# Khi sua src/nmpc/** hoac workflow nay: chi chay job rom. Job pilot chi chay khi
# bam Run workflow (stage = pilot hoac all): 3 vung x 2 muc dong CCCV x 7 ngan sach k
# = 42 job, moi job MOT lan vong kin (toi da 20 job song song).
on:
  push:
    branches: [main]
    paths:
      - 'src/nmpc/**'
      - '.github/workflows/nmpc.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: "rom | pilot | all | debug | replay"
        default: all
      variant:
        description: "pilot: bien the so hoc NMPC (nmpc_variant.m)"
        default: pilot
      variants:
        description: "debug: danh sach bien the (JSON)"
        default: '["pilot"]'
      ks:
        description: "pilot: danh sach chi so k (JSON), 1..7 = 0.8, 1, 1.25, 1.5, 2, 3, khong gioi han; debug: bieu thuc MATLAB"
        default: "[1,2,3,4,5,6,7]"
      wins:
        description: "pilot: danh sach chi so vung (JSON), chay lai mot phan"
        default: "[3, 8, 12]"
      cbases:
        description: "pilot: danh sach dong CCCV goc (JSON, C)"
        default: "[0.5, 1]"
      win:
        description: "debug: chi so vung (soc_windows.m)"
        default: "3"
      cbase:
        description: "debug: dong CCCV goc (C)"
        default: "0.5"
      src_run:
        description: "replay: so run pilot cu de lay *_series.csv"
        default: "44204442587"

# Nhom rieng cho moi lan bam Run workflow (chay song song, khong dung cham lan chay
# cu dang xep hang 44068312720 thuoc nhom cu 'nmpc-refs/heads/main').
concurrency:
  group: nmpc2-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # ---- Buoc E: kiem tra thanh phan + so sanh ROM voi DFN -------------------
  rom:
    if: github.event_name == 'push' || inputs.stage == 'rom' || inputs.stage == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        temp: [25, 10]
        dir: [charge, discharge]
        cfg: [D]   # so sanh A-D: lan chay 44045657657 (tai_lieu/mo_hinh_rut_gon.md muc 2)
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-acados
        with:
          casadi-matlab: 'true'
          codegen-dir: ${{ runner.temp }}/mwork/c_generated_code
      - uses: matlab-actions/setup-matlab@v2
        with:
          cache: true
      - name: ROM ${{ matrix.cfg }} so voi DFN (${{ matrix.dir }}, ${{ matrix.temp }} degC)
        uses: matlab-actions/run-command@v2
        with:
          command: >
            addpath('${{ github.workspace }}/src/dfn'); addpath('${{ github.workspace }}/src/nmpc');
            out = '${{ github.workspace }}/results/rom';
            if ${{ matrix.temp }} == 25 && strcmp('${{ matrix.dir }}', 'charge'), rom_unit_tests(out, '${{ matrix.cfg }}'); end;
            rom_validate(${{ matrix.temp }}, '${{ matrix.dir }}', out, '${{ matrix.cfg }}');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rom-${{ matrix.cfg }}-${{ matrix.dir }}-${{ matrix.temp }}
          path: results/rom
          if-no-files-found: warn

  # ---- Buoc G: chay thu vong kin. Moi job = mot vung x mot muc dong CCCV x MOT
  # ngan sach k (tao bo giai acados trong moi job, ~8 phut).
  pilot:
    if: github.event_name == 'workflow_dispatch' && (inputs.stage == 'pilot' || inputs.stage == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        win: ${{ fromJSON(inputs.wins) }}       # mac dinh [3, 8, 12] = 0->60, 20->80, 40->100 trong soc_windows.m
        cbase: ${{ fromJSON(inputs.cbases) }}   # mac dinh [0.5, 1] dong CCCV goc (C)
        k: ${{ fromJSON(inputs.ks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-acados
        with:
          casadi-matlab: 'true'
          codegen-dir: ${{ runner.temp }}/mwork/c_generated_code
      - uses: matlab-actions/setup-matlab@v2
        with:
          cache: true
      - name: Vung ${{ matrix.win }}, CCCV ${{ matrix.cbase }}C, k so ${{ matrix.k }}
        uses: matlab-actions/run-command@v2
        with:
          command: >
            cd(fullfile('${{ runner.temp }}', 'mwork'));
            addpath('${{ github.workspace }}/src/dfn'); addpath('${{ github.workspace }}/src/nmpc');
            pilot_run(${{ matrix.win }}, ${{ matrix.cbase }}, ${{ matrix.k }}, '${{ github.workspace }}/results/pilot', 'D', '${{ inputs.variant }}', 25, 325);
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-w${{ matrix.win }}-c${{ matrix.cbase }}-k${{ matrix.k }}
          path: results/pilot
          if-no-files-found: warn

  # ---- go loi: mot vung, mot muc dong, it ngan sach ----
  debug:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'debug'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-acados
        with:
          casadi-matlab: 'true'
          codegen-dir: ${{ runner.temp }}/mwork/c_generated_code
      - uses: matlab-actions/setup-matlab@v2
        with:
          cache: true
      - name: Bien the ${{ matrix.variant }}, vung ${{ inputs.win }}, k ${{ inputs.ks }}
        uses: matlab-actions/run-command@v2
        with:
          command: >
            cd(fullfile('${{ runner.temp }}', 'mwork'));
            addpath('${{ github.workspace }}/src/dfn'); addpath('${{ github.workspace }}/src/nmpc');
            pilot_run(${{ inputs.win }}, ${{ inputs.cbase }}, ${{ inputs.ks }}, '${{ github.workspace }}/results/debug', 'D', '${{ matrix.variant }}', 25, 60);
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-${{ matrix.variant }}
          path: results/debug
          if-no-files-found: warn

  # ---- chan doan: ROM chay lai profile dong da ap len DFN (khong can acados) ----
  replay:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'replay'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pilot-w*
          path: results/src
          run-id: ${{ inputs.src_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-acados
        with:
          casadi-matlab: 'true'
          codegen-dir: ${{ runner.temp }}/mwork/c_generated_code
      - uses: matlab-actions/setup-matlab@v2
        with:
          cache: true
      - name: ROM chay lai profile CCCV va NMPC
        uses: matlab-actions/run-command@v2
        with:
          command: >
            addpath('${{ github.workspace }}/src/dfn'); addpath('${{ github.workspace }}/src/nmpc');
            nmpc_replay_diag('${{ github.workspace }}/results/src', '${{ github.workspace }}/results/replay', 'D');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-diag
          path: results/replay

  report:
    needs: pilot
    if: always() && needs.pilot.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pilot-*
          path: results/all
      - uses: matlab-actions/setup-matlab@v2
        with:
          cache: true
      - name: Gop ket qua
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('src/nmpc'); pilot_report('results/all', 'results/report');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-report
          path: results/report
