name: NMPC - mo hinh rut gon va chay thu

# Buoc E (mo hinh rut gon, so voi DFN) va buoc G (NMPC acados, chay thu vong kin).
# Khi sua src/nmpc/** hoac workflow nay: chi chay job rom. Job pilot (6 job) chi
# chay khi bam Run workflow (stage = pilot hoac all): 3 vung x 2 muc dong CCCV = 6 job.
on:
  push:
    branches: [main]
    paths:
      - 'src/nmpc/**'
      - '.github/workflows/nmpc.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: "rom | pilot | all | debug"
        default: all
      variant:
        description: "bien the so hoc NMPC (base | s4n12 | lm10 | s4lm10)"
        default: base
      ks:
        description: "chi so ngan sach k (MATLAB), 1..7 = 0.8, 1, 1.25, 1.5, 2, 3, khong gioi han"
        default: "1:7"
      win:
        description: "debug: chi so vung (soc_windows.m)"
        default: "3"
      cbase:
        description: "debug: dong CCCV goc (C)"
        default: "0.5"

# Nhom rieng cho moi lan bam Run workflow (chay song song, khong dung cham lan chay
# cu dang xep hang 44068312720 thuoc nhom cu 'nmpc-refs/heads/main').
concurrency:
  group: nmpc2-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # ---- Buoc E: kiem tra thanh phan + so sanh ROM voi DFN -------------------
  rom:
    if: github.event_name == 'push' || inputs.stage == 'rom' || inputs.stage == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        temp: [25, 10]
        dir: [charge, discharge]
        cfg: [D]   # so sanh A-D: lan chay 44045657657 (tai_lieu/mo_hinh_rut_gon.md muc 2)
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-acados
        with:
          casadi-matlab: 'true'
          codegen-dir: ${{ runner.temp }}/mwork/c_generated_code
      - uses: matlab-actions/setup-matlab@v2
        with:
          cache: true
      - name: ROM ${{ matrix.cfg }} so voi DFN (${{ matrix.dir }}, ${{ matrix.temp }} degC)
        uses: matlab-actions/run-command@v2
        with:
          command: >
            addpath('${{ github.workspace }}/src/dfn'); addpath('${{ github.workspace }}/src/nmpc');
            out = '${{ github.workspace }}/results/rom';
            if ${{ matrix.temp }} == 25 && strcmp('${{ matrix.dir }}', 'charge'), rom_unit_tests(out, '${{ matrix.cfg }}'); end;
            rom_validate(${{ matrix.temp }}, '${{ matrix.dir }}', out, '${{ matrix.cfg }}');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rom-${{ matrix.cfg }}-${{ matrix.dir }}-${{ matrix.temp }}
          path: results/rom
          if-no-files-found: warn

  # ---- Buoc G: chay thu vong kin. Moi job = mot vung x mot muc dong CCCV, chay
  # lan luot du 7 ngan sach k (tao bo giai acados mot lan moi job).
  pilot:
    if: github.event_name == 'workflow_dispatch' && (inputs.stage == 'pilot' || inputs.stage == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        win: [3, 8, 12]     # 0->60, 20->80, 40->100 trong soc_windows.m
        cbase: [0.5, 1]     # dong CCCV goc (C)
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-acados
        with:
          casadi-matlab: 'true'
          codegen-dir: ${{ runner.temp }}/mwork/c_generated_code
      - uses: matlab-actions/setup-matlab@v2
        with:
          cache: true
      - name: Vung ${{ matrix.win }}, CCCV ${{ matrix.cbase }}C, k = 0.8 ... khong gioi han
        uses: matlab-actions/run-command@v2
        with:
          command: >
            cd(fullfile('${{ runner.temp }}', 'mwork'));
            addpath('${{ github.workspace }}/src/dfn'); addpath('${{ github.workspace }}/src/nmpc');
            pilot_run(${{ matrix.win }}, ${{ matrix.cbase }}, ${{ inputs.ks }}, '${{ github.workspace }}/results/pilot', 'D', '${{ inputs.variant }}', 25, 320);
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-w${{ matrix.win }}-c${{ matrix.cbase }}
          path: results/pilot
          if-no-files-found: warn

  # ---- go loi: mot vung, mot muc dong, it ngan sach ----
  debug:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'debug'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        variant: [base]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-acados
        with:
          casadi-matlab: 'true'
          codegen-dir: ${{ runner.temp }}/mwork/c_generated_code
      - uses: matlab-actions/setup-matlab@v2
        with:
          cache: true
      - name: Bien the ${{ inputs.variant }}, vung ${{ inputs.win }}, k ${{ inputs.ks }}
        uses: matlab-actions/run-command@v2
        with:
          command: >
            cd(fullfile('${{ runner.temp }}', 'mwork'));
            addpath('${{ github.workspace }}/src/dfn'); addpath('${{ github.workspace }}/src/nmpc');
            pilot_run(${{ inputs.win }}, ${{ inputs.cbase }}, ${{ inputs.ks }}, '${{ github.workspace }}/results/debug', 'D', '${{ inputs.variant }}', 25, 130);
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-${{ inputs.variant }}
          path: results/debug
          if-no-files-found: warn

  report:
    needs: pilot
    if: always() && needs.pilot.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pilot-*
          path: results/all
      - uses: matlab-actions/setup-matlab@v2
        with:
          cache: true
      - name: Gop ket qua
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('src/nmpc'); pilot_report('results/all', 'results/report');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-report
          path: results/report
