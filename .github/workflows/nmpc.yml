name: NMPC - mo hinh rut gon va chay thu

# Buoc E (mo hinh rut gon, so voi DFN) va buoc G (NMPC acados, chay thu vong kin).
# Khi sua src/nmpc/** hoac workflow nay: chi chay job rom. Job pilot (21 job) chi
# chay khi bam Run workflow (stage = pilot hoac all).
on:
  push:
    branches: [main]
    paths:
      - 'src/nmpc/**'
      - '.github/workflows/nmpc.yml'
  workflow_dispatch:
    inputs:
      stage:
        description: "rom | pilot | all | debug"
        default: all
      variant:
        description: "bien the so hoc NMPC (base | s4n12 | lm10 | s4lm10)"
        default: base

concurrency:
  group: nmpc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Buoc E: kiem tra thanh phan + so sanh ROM voi DFN -------------------
  rom:
    if: github.event_name == 'push' || inputs.stage == 'rom' || inputs.stage == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        temp: [25, 10]
        dir: [charge, discharge]
        cfg: [D]   # so sanh A-D: lan chay 44045657657 (tai_lieu/mo_hinh_rut_gon.md muc 2)
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-acados
        with:
          casadi-matlab: 'true'
          codegen-dir: ${{ runner.temp }}/mwork/c_generated_code
      - uses: matlab-actions/setup-matlab@v2
        with:
          cache: true
      - name: ROM ${{ matrix.cfg }} so voi DFN (${{ matrix.dir }}, ${{ matrix.temp }} degC)
        uses: matlab-actions/run-command@v2
        with:
          command: >
            addpath('${{ github.workspace }}/src/dfn'); addpath('${{ github.workspace }}/src/nmpc');
            out = '${{ github.workspace }}/results/rom';
            if ${{ matrix.temp }} == 25 && strcmp('${{ matrix.dir }}', 'charge'), rom_unit_tests(out, '${{ matrix.cfg }}'); end;
            rom_validate(${{ matrix.temp }}, '${{ matrix.dir }}', out, '${{ matrix.cfg }}');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rom-${{ matrix.cfg }}-${{ matrix.dir }}-${{ matrix.temp }}
          path: results/rom
          if-no-files-found: warn

  # ---- Buoc G: chay thu vong kin (3 vung x 7 ngan sach), moi job tao bo giai mot lan
  pilot:
    if: github.event_name == 'workflow_dispatch' && (inputs.stage == 'pilot' || inputs.stage == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        win: [1, 2, 3]
        k: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-acados
        with:
          casadi-matlab: 'true'
          codegen-dir: ${{ runner.temp }}/mwork/c_generated_code
      - uses: matlab-actions/setup-matlab@v2
        with:
          cache: true
      - name: Vung ${{ matrix.win }}, ngan sach ${{ matrix.k }}
        uses: matlab-actions/run-command@v2
        with:
          command: >
            cd(fullfile('${{ runner.temp }}', 'mwork'));
            addpath('${{ github.workspace }}/src/dfn'); addpath('${{ github.workspace }}/src/nmpc');
            pilot_run(${{ matrix.win }}, ${{ matrix.k }}, '${{ github.workspace }}/results/pilot', getenv('ROM_CFG'), getenv('NMPC_VARIANT'));
        env:
          ROM_CFG: D
          NMPC_VARIANT: ${{ inputs.variant }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-w${{ matrix.win }}-k${{ matrix.k }}
          path: results/pilot
          if-no-files-found: warn

  # ---- go loi: vung 1, k = 0.8 va 1.5, nhieu bien the so hoc song song ----
  debug:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'debug'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [base]
        k: [1]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-acados
        with:
          casadi-matlab: 'true'
          codegen-dir: ${{ runner.temp }}/mwork/c_generated_code
      - uses: matlab-actions/setup-matlab@v2
        with:
          cache: true
      - name: Bien the ${{ matrix.variant }}, ngan sach ${{ matrix.k }}
        uses: matlab-actions/run-command@v2
        with:
          command: >
            cd(fullfile('${{ runner.temp }}', 'mwork'));
            addpath('${{ github.workspace }}/src/dfn'); addpath('${{ github.workspace }}/src/nmpc');
            pilot_run(1, ${{ matrix.k }}, '${{ github.workspace }}/results/debug', 'D', '${{ matrix.variant }}');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-${{ matrix.variant }}-k${{ matrix.k }}
          path: results/debug
          if-no-files-found: warn

  report:
    needs: pilot
    if: always() && needs.pilot.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pilot-*
          path: results/all
      - uses: matlab-actions/setup-matlab@v2
        with:
          cache: true
      - name: Gop ket qua
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('src/nmpc'); pilot_report('results/all', 'results/report');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-report
          path: results/report
