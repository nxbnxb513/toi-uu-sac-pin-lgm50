name: Chan doan GD-16 (bao hoa be mat hat cuc am khi sac)

# Chan doan: sac CC-CV tu 0 % SOC cho tung bien the tham so (doi mot thu moi lan).
on:
  push:
    branches: [main]
    paths:
      - 'src/dfn/diag/**'
      - '.github/workflows/diag.yml'
  workflow_dispatch:
    inputs:
      variants:
        description: 'Danh sach bien the (JSON), de trong = mac dinh'
        required: false
        default: ''

concurrency:
  group: diag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        variant: ${{ fromJSON(github.event.inputs.variants || '["base","src_paper","src_code","no_stress","EDs_6e4","Dx2","Dx5","Dx10","Dx30","Dconst","hys_delith","hys_lith","no_film","j0n_x10","brug0","start_y0","grid_fine","grid_li"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          cache: true
      - name: Bien the ${{ matrix.variant }}
        uses: matlab-actions/run-command@v2
        with:
          command: addpath('src/dfn'); addpath('src/dfn/diag'); diag_case('${{ matrix.variant }}', 'results/diag');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.variant }}
          path: results/diag
          if-no-files-found: warn

  report:
    needs: diag
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: diag-*
          merge-multiple: true
      - name: Tom tat
        run: |
          for f in results/diag_base.md results/diag_*.md; do
            [ -f "$f" ] || continue
            if [ "$f" != results/diag_base.md ] || [ -z "$done" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; fi
            [ "$f" = results/diag_base.md ] && done=1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: diag-all
          path: results
