name: acados feasibility test

# Kiem tra thuc nghiem: acados chay duoc tren runner GitHub khong
#   A: giao dien MATLAB (MEX) voi giay phep MATLAB cho repo cong khai
#   B: giao dien Python (phuong an du phong)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/acados_test.yml'
      - '.github/actions/setup-acados/**'
      - 'src/acados_test/**'

jobs:
  matlab:
    name: A - acados MATLAB interface (MEX) ${{ matrix.release }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, release: latest }
          - { os: ubuntu-24.04, release: R2024b }
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-acados
        with:
          casadi-matlab: 'true'
          codegen-dir: ${{ runner.temp }}/mwork/c_generated_code
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: ${{ matrix.release }}
          cache: true
      - name: MEX hello world, CasADi, acados closed loop
        uses: matlab-actions/run-command@v2
        with:
          command: cd(fullfile('${{ runner.temp }}','mwork')); addpath('${{ github.workspace }}/src/acados_test'); acados_matlab_test('${{ github.workspace }}/src/acados_test');

  python:
    name: B - acados Python interface (fallback)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-acados
        with:
          python: 'true'
          codegen-dir: ${{ runner.temp }}/pwork/c_generated_code
      - name: Upstream minimal_example_ocp.py
        env:
          MPLBACKEND: Agg
        working-directory: ${{ runner.temp }}
        run: |
          cp -r ~/acados/examples/acados_python/getting_started ex && cd ex
          python minimal_example_ocp.py
      - name: Timed closed-loop NMPC
        run: |
          mkdir -p "$RUNNER_TEMP/pwork" && cd "$RUNNER_TEMP/pwork"
          python "$GITHUB_WORKSPACE/src/acados_test/acados_python_test.py"
